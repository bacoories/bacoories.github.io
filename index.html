  }

  async function runTrack(silent) {
    var err = $('#track-err'), btn = $('#track-btn'), args, nf;
    err.hidden = true;
    if (track.mode === 'code') {
      var c = $('#t-code').value.replace(/\s+/g, '').toUpperCase();
      if (!/^[A-Z0-9]{8}$/.test(c)) { err.textContent = errText('ORDER_NOT_FOUND'); err.hidden = false; return; }
      args = { p_code: c };
      nf = errText('ORDER_NOT_FOUND');
    } else {
      var no = $('#t-no').value.replace(/\s+/g, '').toUpperCase(), l4 = $('#t-last4').value.trim();
      if (!no || !/^[0-9]{4}$/.test(l4)) { err.textContent = 'Order not found. Please check the order number and the last 4 digits of your WhatsApp number.'; err.hidden = false; return; }
      args = { p_order_number: no, p_last4: l4 };
      nf = 'Order not found. Please check the order number and the last 4 digits of your WhatsApp number.';
    }
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      var d = await rpc('get_order_tracking', args);
      if (!d) { track.data = null; $('#track-result').innerHTML = ''; err.textContent = nf; err.hidden = false; return; }
      var prev = track.data && track.data.tracking_code === d.tracking_code ? track.data : null;
      track.data = d;
      if (!prev) { track.draft = { rating: d.review && d.review.rating || 0, text: d.review && d.review.text || '' }; clearProof(); }
      try { history.replaceState(null, '', '#/track/' + d.tracking_code); } catch (e) { /* ignore */ }
      renderTrackResult();
    } catch (e) {
      err.textContent = errText(e.code); err.hidden = false;
    } finally {
      var b = $('#track-btn'); if (b) { b.disabled = false; b.textContent = 'Check status'; }
    }
  }

  var STATUS_TEXT = {
    PENDING: 'We received your order and will confirm it soon.',
    PROCESSING: 'Your order is being prepared.',
    COMPLETED: 'Your order is complete.',
    CANCELLED: 'This order was cancelled.'
  };
  function label(s) { return s.charAt(0) + s.slice(1).toLowerCase(); }

  function normalizeTrack(d) {
    return {
      tracking_code: d.tracking_code, order_number: d.order_number, customer_name: d.customer_name, created_at: d.created_at,
      payment_method: d.payment_method, subtotal: d.subtotal, unique_code: d.unique_code, total: d.total,
      status: d.status, payment_status: d.payment_status, status_label: label(d.status), payment_label: label(d.payment_status),
      heading: 'Order receipt',
      items: (d.items || []).map(function (i) { return { name: i.package_name, type: i.package_type, price: i.unit_price, qty: i.qty, line_total: i.line_total, flavors: i.flavors || [] }; })
    };
  }

  function stepperHtml(status) {
    if (status === 'CANCELLED') return '';
    var order = ['PENDING', 'PROCESSING', 'COMPLETED'], idx = order.indexOf(status);
    return '<ol class="steps" aria-label="Order progress">' + order.map(function (s, i) {
      return '<li class="' + (i < idx || status === 'COMPLETED' ? 'done' : i === idx ? 'now' : '') + '">' + label(s) + '</li>';
    }).join('') + '</ol>';
  }

  function proofBlockHtml(d) {
    var active = d.status === 'PENDING' || d.status === 'PROCESSING';
    var needs = (d.payment_method === 'BCA' || d.payment_method === 'QRIS') && d.payment_status === 'UNPAID' && active;
    if (!needs) return d.has_proof && d.payment_method !== 'CASH_COD' ? '<div class="panel"><h3>Payment proof</h3><p style="margin:6px 0 0">Your payment proof was received.</p></div>' : '';
    if (!d.can_upload_proof) return '<div class="panel"><h3>Payment proof</h3><p style="margin:6px 0 0">' + esc(errText('UPLOAD_LIMIT_REACHED')) + '</p></div>';
    var left = d.proof_uploads_left;
    return '<div class="panel"><h3>Upload payment proof</h3>' +
      '<p class="muted" style="margin:6px 0 10px">' + (d.has_proof ? 'We already have a proof from you. You can replace it. ' : 'After you pay, upload a photo or screenshot of your payment. ') +
      'You have ' + left + ' ' + plural(left, 'upload', 'uploads') + ' left.</p>' +
      '<input class="sr-only" type="file" id="proof-file" accept="image/*">' +
      '<label class="btn sec" for="proof-file" id="proof-pick">' + icon('cam') + (track.proofBlob ? 'Choose another photo' : 'Choose photo') + '</label>' +
      '<div id="proof-prev">' + (track.proofUrl ? '<img class="preview" src="' + esc(track.proofUrl) + '" alt="Preview of your payment proof">' : '') + '</div>' +
      '<p class="muted" id="proof-info" style="font-size:14px;margin:0 0 10px"></p>' +
      '<p class="err" id="proof-err" role="alert" hidden></p>' +
      '<button class="btn block" type="button" id="proof-send" data-action="proof-send"' + (track.proofBlob ? '' : ' disabled') + '>Upload payment proof</button></div>';
  }
  function starsHtml(r) {
    var o = '<div class="stars" role="radiogroup" aria-label="Rating">';
    for (var i = 1; i <= 5; i++) {
      o += '<button type="button" class="star' + (i <= r ? ' on' : '') + '" role="radio" aria-checked="' + (i === r) + '" aria-label="' + i + ' ' + plural(i, 'star', 'stars') + '" data-action="star" data-n="' + i + '"><svg aria-hidden="true"><use href="#i-star"/></svg></button>';
    }
    return o + '</div>';
  }
  function reviewBlockHtml(d) {
    var rv = d.review || {};
    if (!rv.can_review) return '';
    var existing = rv.rating != null;
    if (existing && !rv.can_edit) {
      var st = ''; for (var i = 1; i <= 5; i++) st += '<span class="star' + (i <= rv.rating ? ' on' : '') + '" style="width:30px;height:30px"><svg aria-hidden="true"><use href="#i-star"/></svg></span>';
      return '<div class="panel"><h3>Your review</h3><div class="stars" role="img" aria-label="' + rv.rating + ' out of 5 stars">' + st + '</div>' +
        (rv.text ? '<p style="overflow-wrap:anywhere">' + esc(rv.text) + '</p>' : '') + '<p class="muted" style="font-size:14px;margin:0">' + esc(errText('EDIT_LIMIT_REACHED')) + '</p></div>';
    }
    return '<div class="panel"><h3>' + (existing ? 'Your review' : 'Leave a review') + '</h3>' +
      (existing ? '<p class="muted" style="font-size:14px;margin:4px 0 0">You can edit your review ' + rv.edits_left + ' more ' + plural(rv.edits_left, 'time', 'times') + ' within 7 days of your first review.</p>' : '<p class="muted" style="margin:4px 0 0">How was your order?</p>') +
      '<div id="rv-stars">' + starsHtml(track.draft.rating) + '</div>' +
      '<div class="field"><label for="rv-text">Your review (optional)</label><textarea id="rv-text" maxlength="1000">' + esc(track.draft.text) + '</textarea><p class="hint" id="rv-count">' + (track.draft.text || '').length + ' / 1000</p></div>' +
      '<p class="err" id="rv-err" role="alert" hidden></p>' +
      '<button class="btn block" type="button" id="rv-send" data-action="review-send">' + (existing ? 'Save changes' : 'Submit review') + '</button></div>';
  }

  function renderTrackResult() {
    var d = track.data, box = $('#track-result');
    if (!box || !d) return;
    var active = d.status === 'PENDING' || d.status === 'PROCESSING';
    var showPay = (d.payment_method === 'BCA' || d.payment_method === 'QRIS') && d.payment_status === 'UNPAID' && active;
    var n = normalizeTrack(d);
    box.innerHTML = '<section class="ticket" aria-live="polite"><div class="chips"><span class="chip ' + esc(d.status) + '">' + esc(label(d.status)) + '</span>' +
      '<span class="chip ' + esc(d.payment_status) + '">' + esc(label(d.payment_status)) + '</span></div>' +
      '<p style="font-weight:600;margin-bottom:4px">' + esc(STATUS_TEXT[d.status] || '') + '</p>' + stepperHtml(d.status) +
      '<hr class="sep"><dl class="kv">' + (d.order_number ? '<dt>Order no.</dt><dd>' + esc(d.order_number) + '</dd>' : '') +
      '<dt>Tracking code</dt><dd>' + esc(d.tracking_code) + '</dd><dt>Name</dt><dd>' + esc(d.customer_name) + '</dd><dt>Placed on</dt><dd>' + esc(fmtDate(d.created_at)) + '</dd>' +
      '<dt>Payment</dt><dd>' + esc(methodLabel(d.payment_method)) + '</dd></dl>' +
      '<hr class="sep">' + itemsHtml(n.items) + '<hr class="sep">' + totalsHtml(d) + '</section>' +
      (showPay ? payBlock(d.payment_method, d.total) : '') +
      proofBlockHtml(d) + reviewBlockHtml(d) +
      '<div class="actions"><button class="btn" type="button" data-action="dl-receipt" data-src="track">' + icon('down') + 'Download receipt (PNG)</button>' +
      '<button class="btn sec" type="button" data-action="copy" data-text="' + esc(d.tracking_code) + '" data-msg="Tracking code copied">' + icon('copy') + 'Copy tracking code</button>' +
      '<button class="btn sec" type="button" data-action="track-refresh">Refresh status</button></div>';
  }

  /* ---------- Payment proof ---------- */
  function clearProof() {
    if (track.proofUrl) { try { URL.revokeObjectURL(track.proofUrl); } catch (e) { /* ignore */ } }
    track.proofBlob = null; track.proofUrl = null;
  }
  function decodeImage(file) {
    function viaImg() {
      return new Promise(function (resolve, reject) {
        var u = URL.createObjectURL(file), i = new Image();
        i.onload = function () { URL.revokeObjectURL(u); resolve(i); };
        i.onerror = function () { URL.revokeObjectURL(u); reject(new Error('decode')); };
        i.src = u;
      });
    }
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(viaImg);
    }
    return viaImg();
  }
  async function compressImage(file) {
    var img;
    try { img = await decodeImage(file); } catch (e) { throw appErr('INVALID_FILE_TYPE'); }
    var w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
    if (!w || !h) throw appErr('INVALID_FILE_TYPE');
    var scale = Math.min(1, 1280 / Math.max(w, h)), cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale)), q = 0.85;
    for (var tries = 0; tries < 10; tries++) {
      var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      var blob = await new Promise(function (res) { cv.toBlob(res, 'image/jpeg', q); });
      if (blob && blob.size <= MAX_PROOF_BYTES) { if (img.close) img.close(); return blob; }
      if (q > 0.45) q = Math.max(0.4, q - 0.15);
      else { cw = Math.max(1, Math.round(cw * 0.8)); ch = Math.max(1, Math.round(ch * 0.8)); q = 0.7; }
    }
    throw appErr('FILE_TOO_LARGE');
  }
  async function onProofChosen(input) {
    var file = input.files && input.files[0];
    var info = $('#proof-info'), err = $('#proof-err'), send = $('#proof-send');
    if (!file) return;
    err.hidden = true; send.disabled = true; info.textContent = 'Preparing photo…';
    clearProof(); $('#proof-prev').innerHTML = '';
    try {
      var blob = await compressImage(file);
      track.proofBlob = blob; track.proofUrl = URL.createObjectURL(blob);
      $('#proof-prev').innerHTML = '<img class="preview" src="' + esc(track.proofUrl) + '" alt="Preview of your payment proof">';
      info.textContent = 'Photo ready (' + Math.max(1, Math.round(blob.size / 1000)) + ' KB).';
      send.disabled = false;
      var pk = $('#proof-pick'); if (pk) pk.lastChild.textContent = 'Choose another photo';
    } catch (e) {
      info.textContent = ''; err.textContent = errText(e.code || 'INVALID_FILE_TYPE'); err.hidden = false;
    }
    input.value = '';
  }
  async function sendProof() {
    var d = track.data, send = $('#proof-send'), err = $('#proof-err');
    if (!d || !track.proofBlob) return;
    err.hidden = true; send.disabled = true; send.textContent = 'Uploading…';
    try {
      await uploadProof(d.tracking_code, track.proofBlob);
      clearProof();
      toast('Payment proof uploaded');
      var fresh = await rpc('get_order_tracking', { p_code: d.tracking_code });
      if (fresh) track.data = fresh;
      renderTrackResult();
    } catch (e) {
      send.disabled = false; send.textContent = 'Upload payment proof';
      err.textContent = errText(e.code); err.hidden = false;
      if (e.code === 'UPLOAD_LIMIT_REACHED' || e.code === 'UPLOAD_NOT_ALLOWED') {
        try { var f2 = await rpc('get_order_tracking', { p_code: d.tracking_code }); if (f2) { track.data = f2; clearProof(); renderTrackResult(); var e2 = $('#proof-err'); if (e2) { e2.textContent = errText(e.code); e2.hidden = false; } } } catch (x) { /* ignore */ }
      }
    }
  }

  /* ---------- Review ---------- */
  async function sendReview() {
    var d = track.data, err = $('#rv-err'), btn = $('#rv-send');
    track.draft.text = $('#rv-text').value;
    err.hidden = true;
    if (!track.draft.rating) { err.textContent = errText('INVALID_RATING'); err.hidden = false; return; }
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await rpc('submit_review', { p_code: d.tracking_code, p_rating: track.draft.rating, p_text: track.draft.text });
      var fresh = await rpc('get_order_tracking', { p_code: d.tracking_code });
      if (fresh) { track.data = fresh; track.draft = { rating: fresh.review.rating || 0, text: fresh.review.text || '' }; }
      toast('Thank you! Your review was saved.');
      renderTrackResult();
    } catch (e) {
      btn.disabled = false; btn.textContent = old;
      err.textContent = errText(e.code); err.hidden = false;
    }
  }

  /* ======================================================================
     Events
     ====================================================================== */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-action');
    var fid = Number(el.getAttribute('data-fid')), id = Number(el.getAttribute('data-id')), key = el.getAttribute('data-key');
    switch (a) {
      case 'retry': route(); break;
      case 'add-combo': {
        var p = catalog.packages.filter(function (x) { return x.id === id; })[0];
        if (!p || !isOpen()) break;
        var ok = addToCart({ package_id: p.id, name: p.name, type: 'COMBO', price: p.price, image_url: p.image_url || null,
          flavors: p.flavors.map(function (f) { return { id: f.id, name: f.name, qty: f.qty }; }) });
        if (ok) { toast('Added to your order'); renderCartBar(); }
        break;
      }
      case 'pick': openPicker(id); break;
      case 'pk-close': closePicker(); break;
      case 'pk-add': pickerAdd(fid); break;
      case 'pk-sub': pickerSub(fid); break;
      case 'pk-toggle': if (picker.counts[fid]) pickerSub(fid); else pickerAdd(fid); break;
      case 'pk-confirm': pickerConfirm(); break;
      case 'sg-inc': changeSingle(fid, 1); break;
      case 'sg-dec': changeSingle(fid, -1); break;
      case 'qty-inc': { var l1 = findLine(key); if (l1 && l1.qty < maxQtyOf(l1)) { l1.qty++; saveCart(); renderCheckoutLines(); } break; }
      case 'qty-dec': { var l2 = findLine(key); if (l2 && l2.qty > 1) { l2.qty--; saveCart(); renderCheckoutLines(); } break; }
      case 'remove': cart = cart.filter(function (l) { return lineKey(l) !== key; }); saveCart(); renderCheckoutLines(); break;
      case 'copy': copyText(el.getAttribute('data-text'), el.getAttribute('data-msg')); break;
      case 'dl-receipt': {
        var src = el.getAttribute('data-src');
        if (src === 'receipt') { var rd = getReceipt(); if (rd) downloadReceipt(rd, el); }
        else if (track.data) downloadReceipt(normalizeTrack(track.data), el);
        break;
      }
      case 'track-mode': {
        track.mode = el.getAttribute('data-mode');
        $$('[data-action="track-mode"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === track.mode)); });
        var tc = $('#tf-code'), tn = $('#tf-number'), te = $('#track-err');
        if (tc) tc.hidden = track.mode !== 'code';
        if (tn) tn.hidden = track.mode !== 'number';
        if (te) te.hidden = true;
        break;
      }
      case 'track-refresh': runTrack(); break;
      case 'proof-send': sendProof(); break;
      case 'star': {
        track.draft.rating = Number(el.getAttribute('data-n'));
        track.draft.text = ($('#rv-text') || {}).value || track.draft.text;
        $('#rv-stars').innerHTML = starsHtml(track.draft.rating);
        var again = $('#rv-stars [data-n="' + track.draft.rating + '"]'); if (again) again.focus();
        break;
      }
      case 'review-send': sendReview(); break;
    }
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id === 'co-form') { ev.preventDefault(); submitOrder(); }
    else if (ev.target.id === 'track-form') { ev.preventDefault(); runTrack(); }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'proof-file') onProofChosen(ev.target);
    else if (ev.target.name === 'pm') saveDraft();
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'f-name' || ev.target.id === 'f-wa') saveDraft();
    if (ev.target.id === 'rv-text') { track.draft.text = ev.target.value; var c = $('#rv-count'); if (c) c.textContent = ev.target.value.length + ' / 1000'; }
  });
  document.addEventListener('keydown', function (ev) {
    if (!picker) return;
    if (ev.key === 'Escape') { closePicker(); return; }
    if (ev.key === 'Tab') {        // keep keyboard focus inside the picker
      var f = $$('#modal-root button:not([disabled])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener('click', function (ev) {
    if (picker && ev.target.id === 'overlay') closePicker();
  });
  window.addEventListener('hashchange', function () { route(); });
  setInterval(function () {
    var r = parseRoute().name;
    if (document.visibilityState === 'visible' && (r === 'catalog' || r === 'checkout') && !picker) refreshStore(false);
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { var r = parseRoute().name; if (r === 'catalog' || r === 'checkout') refreshStore(true); }
  });

  /* ======================================================================
     Start
     ====================================================================== */
  (function initLogo() {
    var logo = $('#logo'), brand = $('#brand');
    if (!LOGO_URL) return;
    logo.onload = function () { logo.hidden = false; brand.classList.add('has-logo'); };
    logo.onerror = function () { logo.hidden = true; brand.classList.remove('has-logo'); };
    logo.src = LOGO_URL;
  })();
  loadCart();
  route();
})();
</script>
</body>
</html>
