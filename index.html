<style>
/* ---------- Colors: change the values here to restyle the whole website ---------- */
:root{
  /* Palette taken from the logo: blue #4F7CB6, brown #6B4B2C, cream #F1EADF */
  --cocoa:#46301C;       /* text (dark brown from the logo) */
  --cocoa-soft:#7B6450;  /* secondary text */
  --blue:#3F6BA6;        /* main buttons, selected state (logo blue, a bit deeper for contrast) */
  --blue-deep:#2F5688;   /* blue text/links */
  --blue-logo:#4F7CB6;   /* exact logo blue (decorations) */
  --blue-soft:#E2EBF7;   /* soft blue background */
  --cream:#F1EADF;       /* logo cream: placeholders, pills */
  --gold:#F2C14E;        /* review stars */
  --berry:#C8264F;       /* errors, cancelled */
  --berry-soft:#FDE6EB;
  --milk:#FAF6EF;        /* page background */
  --paper:#FFFFFF;       /* cards */
  --line:#E3D8C8;        /* borders */
  --ok:#1D7A4B;
  --ok-soft:#E2F5EA;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r-card:20px; --r-btn:14px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--milk);color:var(--cocoa);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--cocoa-soft)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px}
.narrow{max-width:620px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px;padding:10px 0}
.brand{display:flex;align-items:center;min-height:44px;text-decoration:none}
.brand img{max-height:62px;max-width:190px;width:auto;object-fit:contain}
.brand-name{font:800 23px/1.1 var(--font-display);letter-spacing:-.01em}
.brand.has-logo .brand-name{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
main{padding:4px 0 132px;min-height:60vh}
h1{font:800 clamp(30px,8vw,44px)/1.04 var(--font-display);letter-spacing:-.02em;margin:10px 0 12px}
h2{font:700 23px/1.2 var(--font-display);letter-spacing:-.01em;margin:30px 0 12px}
h3{font:700 19px/1.25 var(--font-display);margin:0}
p{margin:0 0 10px}
.lead{color:var(--cocoa-soft);margin-bottom:16px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:none;font-weight:600;margin-left:-6px;padding:0 6px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:2px solid var(--blue);border-radius:var(--r-btn);background:var(--blue);color:#fff;font-weight:700;line-height:1.2;text-align:center;text-decoration:none}
.btn.sec{background:var(--paper);color:var(--blue-deep)}
.btn.big{min-height:56px;font-size:17px}
.btn.block{width:100%}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0 4px;min-height:44px;font-weight:600;text-decoration:underline;color:var(--blue-deep)}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid var(--blue);border-radius:999px;font-weight:700;text-decoration:none;background:var(--paper);color:var(--blue-deep);white-space:nowrap}

/* ---------- Notices ---------- */
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin:0 0 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper)}
.notice .i{margin-top:2px}
.notice strong{display:block}
.notice.open{background:var(--ok-soft);border-color:#B9E0C8}
.notice.closed{background:var(--berry-soft);border-color:#F2BBC8}
.notice.allergy{background:#FBF1DC;border-color:#E6CF9A}
.notice.error{background:var(--berry-soft);border-color:#F2BBC8}
.notice p:last-child{margin-bottom:0}

/* ---------- Package cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:940px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.card .pic{aspect-ratio:16/11;background:var(--cream);overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .body{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;flex:1}
.card .desc{color:var(--cocoa-soft);font-size:15px;margin:0}
.card .rule{font-size:15px;font-weight:600;margin:0}
.card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.price{font:800 22px/1 var(--font-display);letter-spacing:-.01em}
.inc{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.inc li{background:var(--cream);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.thumbs{display:flex;align-items:center}
.thumbs .t{width:38px;height:38px;border-radius:50%;border:2px solid var(--paper);margin-left:-10px;background:var(--cream);overflow:hidden;flex:none}
.thumbs .t:first-child{margin-left:0}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .more{display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--blue-soft);color:var(--blue-deep)}
.ph{width:100%;height:100%;display:grid;place-items:center;color:#B08F66;background:var(--cream)}
.ph svg{width:42%;height:42%;max-width:64px;max-height:64px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.t .ph svg{width:60%;height:60%}

/* ---------- Single cookies (small vertical cards, 2 per row) ---------- */
.singles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){.singles{gap:16px}}
@media(min-width:940px){.singles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.srow{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-card);overflow:hidden;padding:0 0 12px}
.srow .sp{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--cream)}
.srow .sp img{width:100%;height:100%;object-fit:cover}
.srow .sm{flex:1;min-width:0;padding:0 12px}
.srow .sn{font:700 17px/1.25 var(--font-display);overflow-wrap:anywhere}
.srow .spr{font:800 18px/1.2 var(--font-display);color:var(--cocoa);margin-top:2px}
.srow .sd{font-size:14px;color:var(--cocoa-soft);margin-top:4px;overflow-wrap:anywhere}
.srow>.btn{margin:0 12px}
.srow .qty{justify-content:space-between;margin:0 12px}
.sec-note{margin:-4px 0 12px}

/* ---------- Running promo banner (very top, above the logo) ---------- */
.promo-bar{background:var(--blue-deep);color:#fff;overflow:hidden;white-space:nowrap;position:relative}
.promo-track{display:inline-flex;min-width:100%;animation:promo-run var(--promo-secs,24s) linear infinite;will-change:transform}
.promo-bar:hover .promo-track,.promo-bar:active .promo-track,.promo-bar:focus-within .promo-track{animation-play-state:paused}
.promo-set{display:inline-flex;align-items:center;flex:none}
.promo-item{display:inline-flex;align-items:center;gap:8px;padding:10px 28px;font-weight:700;font-size:15px;line-height:1.2}
.promo-item svg.i{width:18px;height:18px}
.promo-item em{font-style:normal;font-weight:600;opacity:.92}
@keyframes promo-run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){
  .promo-bar{white-space:normal}
  .promo-track{animation:none;display:block;min-width:0}
  .promo-set[aria-hidden="true"]{display:none}
  .promo-set{display:flex;flex-wrap:wrap;justify-content:center}
}
.tile .nd{padding:0 10px 8px;font-size:13px;line-height:1.3;color:var(--cocoa-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.offers{display:grid;gap:8px;margin-top:12px}
.offer{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--blue-soft);font-size:15px}
.offer .i{margin-top:2px;color:var(--blue-deep)}
.offer strong{display:block}
.offer span{display:block;color:var(--cocoa-soft)}
.offer.tip{background:var(--cream)}
.line.free .lt{color:var(--ok)}
.freetag{font:800 18px var(--font-display);color:var(--ok)}
.totals .r.save{color:var(--ok);font-weight:600}

/* ---------- Skeleton ---------- */
.sk{background:linear-gradient(90deg,#EFE6D8 25%,#F7F1E7 50%,#EFE6D8 75%);background-size:200% 100%;animation:shine 1.3s linear infinite;border-radius:var(--r-card)}
.sk.card-sk{height:330px}
@keyframes shine{to{background-position:-200% 0}}

/* ---------- Cart bar ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.cartbar a{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;min-height:60px;padding:0 18px;background:var(--blue);color:#fff;border-radius:18px;text-decoration:none;font-weight:700;box-shadow:0 8px 24px rgba(47,86,136,.35)}
.cartbar .count{background:var(--cream);color:var(--cocoa);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 8px}
.cartbar .grow{flex:1}
.cartbar .amt{font-family:var(--font-display);font-size:18px}

/* ---------- Toast ---------- */
.toasts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{background:var(--cocoa);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;max-width:420px;text-align:center;box-shadow:0 6px 20px rgba(70,48,28,.3)}
.toast.bad{background:var(--berry)}

/* ---------- Picker sheet ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(70,48,28,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{display:flex;flex-direction:column;width:100%;max-width:780px;height:92vh;height:calc(100dvh - 20px);background:var(--milk);border-radius:26px 26px 0 0;overflow:hidden;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:760px){.overlay{align-items:center}.sheet{height:min(86vh,780px);border-radius:26px}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 6px 18px}
.sheet-head h2{margin:0;font-size:22px}
.xbtn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);color:var(--blue-deep);background:var(--paper);display:grid;place-items:center}
.boxbar{padding:6px 18px 12px}
.boxbar .count{font-weight:700;margin-bottom:8px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:34px;height:34px;border-radius:50%;border:2px dashed #CBB9A0;background:var(--paper);overflow:hidden;flex:none}
.slot.full{border:2px solid var(--blue)}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .ph svg{width:62%;height:62%}
.meter{height:12px;border-radius:999px;background:var(--paper);border:2px solid var(--blue);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue-logo);width:0;transition:width .2s}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 16px 16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch;align-content:start;grid-auto-rows:max-content}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--line);border-radius:18px;overflow:hidden;padding:0;text-align:left}
.tile.on{border-color:var(--blue)}
.tile .shot{position:relative;flex:none;aspect-ratio:1/1;width:100%;background:var(--cream);border:0;padding:0;display:block;overflow:hidden}
.tile .shot img{width:100%;height:100%;object-fit:cover}
.tile .badge{position:absolute;top:8px;right:8px;min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:var(--blue);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:none;place-items:center;font:800 16px var(--font-display)}
.tile.on .badge{display:grid}
.tile .nm{padding:8px 10px 2px;font-weight:600;font-size:15px;line-height:1.25}
.tile .ctl{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px}
.tile .ctl output{font:800 18px var(--font-display);min-width:24px;text-align:center}
.tile.pickone{cursor:pointer}
.tile.pickone .nm{padding-bottom:12px}
.sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--paper);border-top:1.5px solid var(--line)}
.sheet-foot .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}

/* ---------- Quantity stepper ---------- */
.qty{display:inline-flex;align-items:center;gap:4px}
.qbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);color:var(--blue-deep);background:var(--paper);display:grid;place-items:center;padding:0}
.qbtn:disabled{opacity:.35;cursor:not-allowed}
.qty output{min-width:30px;text-align:center;font:800 18px var(--font-display)}

/* ---------- Forms ---------- */
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-weight:700;margin-bottom:6px}
.field .hint{font-size:14px;color:var(--cocoa-soft);margin:4px 0 0}
input[type=text],input[type=tel],input[type=search],textarea{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(79,124,182,.28)}
input[aria-invalid=true]{border-color:var(--berry)}
#t-code,#t-no{text-transform:uppercase}
.err{color:var(--berry);font-weight:600;font-size:15px;margin:6px 0 0}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.pm{display:grid;gap:10px}
.pm label{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--paper);cursor:pointer;margin:0;font-weight:400}
.pm input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.pm label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.pm strong{display:block}
.pm span.sub{font-size:14px;color:var(--cocoa-soft)}

/* ---------- Order lines ---------- */
.line{display:flex;gap:12px;padding:14px 0;border-top:1.5px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.line .lp{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none;background:var(--cream)}
.line .lp img{width:100%;height:100%;object-fit:cover}
.line .lm{flex:1;min-width:0}
.line .ln{font:700 17px/1.25 var(--font-display);overflow-wrap:anywhere}
.line .lf{font-size:14px;color:var(--cocoa-soft);margin:2px 0 6px;overflow-wrap:anywhere}
.line .lr{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.line .lt{font:800 18px var(--font-display)}
.totals{display:grid;gap:6px;margin-top:6px}
.totals .r{display:flex;justify-content:space-between;gap:12px}
.totals .r.big{font:800 22px/1.2 var(--font-display);padding-top:8px;border-top:2px solid var(--cocoa);margin-top:4px}

/* ---------- Receipt / ticket ---------- */
.ticket{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-card);padding:18px 16px;margin-bottom:16px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--blue-soft);border-radius:16px;padding:14px 16px;margin:12px 0}
.codebox .k{font-size:14px;font-weight:700}
.codebox .v{font:800 clamp(30px,9vw,42px)/1.05 var(--font-display);letter-spacing:.12em}
.sep{border:0;border-top:2px dashed var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--cocoa-soft)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;text-align:right}
.paybox{border:2px solid var(--blue);border-radius:16px;padding:14px 16px;margin:12px 0;background:var(--paper)}
.paybox h3{margin-bottom:8px}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0}
.copyrow .big{font:800 22px/1.2 var(--font-display);overflow-wrap:anywhere}
.qr{width:min(260px,100%);height:auto;margin:8px auto;border:2px solid var(--line);border-radius:12px;background:#fff}
.actions{display:grid;gap:10px;margin-top:6px}
@media(min-width:560px){.actions{grid-template-columns:1fr 1fr}}

/* ---------- Tracking ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--paper);border:2px solid var(--blue);border-radius:16px;padding:4px;margin-bottom:16px}
.seg button{min-height:46px;border:0;border-radius:12px;background:transparent;font-weight:700}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;border:2px solid var(--cocoa);background:var(--paper)}
.chip.PENDING{background:var(--cream)}
.chip.PROCESSING{background:#DCEBFF;border-color:#27518F;color:#17376B}
.chip.COMPLETED,.chip.PAID{background:var(--ok-soft);border-color:var(--ok);color:#0F5A33}
.chip.CANCELLED{background:var(--berry-soft);border-color:var(--berry);color:#8E1636}
.chip.UNPAID{background:var(--paper)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px;padding:0;list-style:none}
.steps li{position:relative;text-align:center;font-size:14px;font-weight:600;color:var(--cocoa-soft);padding-top:34px}
.steps li::before{content:"";position:absolute;top:0;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.steps li::after{content:"";position:absolute;top:12px;left:calc(-50% + 13px);width:calc(100% - 26px);height:2px;background:var(--line)}
.steps li:first-child::after{display:none}
.steps li.done,.steps li.now{color:var(--cocoa)}
.steps li.done::before{background:var(--blue);border-color:var(--blue)}
.steps li.now::before{background:var(--blue-soft);border-color:var(--blue)}
.steps li.done::after,.steps li.now::after{background:var(--blue)}
.stars{display:flex;gap:2px;margin:4px 0 12px}
.star{width:48px;height:48px;border:0;background:none;padding:0;display:grid;place-items:center;color:#CBB9A0}
.star svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on{color:var(--cocoa)}
.star.on svg{fill:var(--gold);stroke:var(--cocoa)}

<script>
(function () {
  'use strict';

  /* ======================================================================
     Constants and texts
     ====================================================================== */
  var CART_KEY = 'ck_cart_v1';
  var RECEIPT_KEY = 'ck_receipt_v1';
  var DRAFT_KEY = 'ck_draft_v1';   // name, WhatsApp and payment method typed at checkout (kept on this phone only)
  var MAX_LINES = 40, MAX_QTY = 20, MAX_SINGLE = 99;   // lines per order; bundles per line; singles per flavor
  var MAX_PROOF_BYTES = 500000;           // server limit is 512000 bytes
  var SVG_NS = 'http://www.w3.org/2000/svg';

  var MSG = {
    REQUEST_REJECTED: 'Request rejected. Please reload the page and try again.',
    STORE_CLOSED: 'Sorry, ordering is closed. Your order was not recorded. Please wait for the next order schedule.',
    INVALID_NAME: 'Name must be 2–60 characters.',
    INVALID_WHATSAPP: 'Invalid WhatsApp number. Example: 081234567890.',
    INVALID_PAYMENT_METHOD: 'Please choose a payment method.',
    INVALID_ITEMS: 'Your cart is invalid. Please check the quantities.',
    TOO_MANY_PENDING: 'This number already has several orders waiting for confirmation. Please contact the admin first.',
    PACKAGE_UNAVAILABLE: 'A menu item or package is no longer available. The menu has been updated.',
    TOO_MANY_LINES: 'Your order has too many different items. Please remove some items.',
    INVALID_PACKAGE: 'This package has a problem. Please contact the admin.',
    INVALID_FLAVOR: 'A flavor is not available. Please choose your flavors again.',
    WRONG_PICK_COUNT: 'The number of flavors chosen is not correct yet.',
    TRACKING_CODE_FAILED: 'The system is busy. Please try again in a moment.',
    UNIQUE_CODE_EXHAUSTED: 'The system is busy. Please try again in a moment.',
    ORDER_NOT_FOUND: 'Order not found. Please check the code.',
    ORDER_NOT_COMPLETED: 'You can leave a review after your order is completed.',
    INVALID_RATING: 'Please choose 1–5 stars.',
    REVIEW_TOO_LONG: 'Review can be at most 1000 characters.',
    EDIT_LIMIT_REACHED: 'This review can no longer be edited.',
    FILE_TOO_LARGE: 'Photo is too large (max 500 KB).',
    INVALID_FILE_TYPE: 'Photo must be JPG or PNG.',
    UPLOAD_LIMIT_REACHED: 'Upload limit (3 times) reached. Please contact the admin.',
    UPLOAD_NOT_ALLOWED: 'Payment proof cannot be uploaded for this order.',
    FAILED: 'Failed, please try again.',
    NETWORK: 'Connection problem. Please check your internet and try again.'
  };
  function errText(code) { return MSG[code] || MSG.FAILED; }
  function appErr(code) { var e = new Error(code); e.code = code; return e; }

  /* ======================================================================
     Small helpers
     ====================================================================== */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rp(n) { return 'Rp ' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function icon(id, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function safeUrl(u) { return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : ''; }

  var DATE_FMT = null;
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try {
      DATE_FMT = DATE_FMT || new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      var m = {};
      DATE_FMT.formatToParts(d).forEach(function (p) { m[p.type] = p.value; });
      return m.day + ' ' + m.month + ' ' + m.year + ', ' + m.hour + ':' + m.minute + ' WIB';
    } catch (e) { return d.toISOString(); }
  }
  function isFuture(iso) { return !!iso && new Date(iso).getTime() > Date.now(); }

  var MEM = {};
  function lsGet(k) {
    var v = null;
    try { v = localStorage.getItem(k); } catch (e) { /* storage blocked */ }
    return v === null && MEM[k] !== undefined ? MEM[k] : v;
  }
  function lsSet(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* keep in memory */ } }
  function lsDel(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  function placeholder() { return '<div class="ph"><svg aria-hidden="true"><use href="#i-cookie"/></svg></div>'; }
  function photo(url, cover) {
    var u = safeUrl(url);
    return u ? '<img src="' + esc(u) + '" alt="" loading="lazy" decoding="async" data-photo>' : placeholder();
  }
  // A broken photo link is replaced by the cookie placeholder.
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.hasAttribute('data-photo')) {
      var d = document.createElement('div');
      d.innerHTML = placeholder();
      t.replaceWith(d.firstChild);
    }
  }, true);

  var toastTimer = null;
  function toast(msg, bad) {
    var box = $('#toasts');
    box.innerHTML = '';
    var t = document.createElement('div');
    t.className = 'toast' + (bad ? ' bad' : '');
    t.textContent = msg;
    box.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.innerHTML = ''; }, bad ? 4200 : 2400);
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? (okMsg || 'Copied') : 'Could not copy. Please copy it by hand.', !ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg || 'Copied'); }, fallback);
    } else { fallback(); }
  }

  /* ======================================================================
     Supabase calls (plain HTTPS, header "apikey" only)
     ====================================================================== */
  function configOk() {
    return /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SUPABASE_URL) || /^http:\/\/localhost/.test(SUPABASE_URL);
  }
  function keyOk() { return typeof SUPABASE_PUBLIC_KEY === 'string' && SUPABASE_PUBLIC_KEY.indexOf('sb_secret_') !== 0 && SUPABASE_PUBLIC_KEY.length > 20; }

  async function rpc(name, params) {
    var res, text;
    try {
      res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_PUBLIC_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(params || {})
      });
      text = await res.text();
    } catch (e) { throw appErr('NETWORK'); }
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) {
      var m = data && typeof data.message === 'string' ? data.message.trim() : '';
      throw appErr(/^[A-Z_]{3,40}$/.test(m) ? m : 'FAILED');
    }
    return data;
  }

  async function uploadProof(code, blob) {
    var fd = new FormData();
    fd.append('code', code);
    fd.append('file', blob, 'proof.jpg');
    var res, data = null;
    try {
      res = await fetch(EDGE_UPLOAD_URL, { method: 'POST', headers: { 'apikey': SUPABASE_PUBLIC_KEY }, body: fd });
      try { data = await res.json(); } catch (e) { data = null; }
    } catch (e) { throw appErr('NETWORK'); }
    if (!res.ok || !data || data.ok !== true) {
      var c = data && typeof data.error === 'string' && /^[A-Z_]{3,40}$/.test(data.error) ? data.error : 'FAILED';
      throw appErr(c);
    }
    return data;
  }

  /* ======================================================================
     State: shop, catalog, cart, last receipt
     ====================================================================== */
  var store = null, catalog = null, cart = [], picker = null, storeTimer = null, routeSeq = 0, submitting = false;

  function loadCart() {
    try {
      var a = JSON.parse(lsGet(CART_KEY) || '[]');
      cart = Array.isArray(a) ? a.filter(function (l) {
        if (!l || typeof l.name !== 'string' || !Number.isInteger(l.qty) || l.qty < 1 || typeof l.price !== 'number') return false;
        if (l.type === 'SINGLE') return Number.isInteger(l.flavor_id) && l.qty <= MAX_SINGLE;
        return Number.isInteger(l.package_id) && Array.isArray(l.flavors);
      }).slice(0, MAX_LINES) : [];
    } catch (e) { cart = []; }
  }
  function saveCart() { lsSet(CART_KEY, JSON.stringify(cart)); }
  function lineKey(item) {
    if (item.type === 'SINGLE') return 'S|' + item.flavor_id;
    return item.package_id + '|' + item.flavors.map(function (f) { return f.id + ':' + f.qty; }).sort().join(',');
  }
  function cartCount() { return cart.reduce(function (n, l) { return n + l.qty; }, 0); }
  function cartTotal() { return getPlan().total; }
  function maxQtyOf(l) { return l.type === 'SINGLE' ? MAX_SINGLE : MAX_QTY; }

  function addToCart(item) {
    var key = lineKey(item);
    var ex = cart.filter(function (l) { return lineKey(l) === key; })[0];
    if (ex) {
      if (ex.qty >= maxQtyOf(ex)) { toast('You can order at most ' + maxQtyOf(ex) + ' of the same item.', true); return false; }
      ex.qty += 1;
    } else {
      if (cart.length >= MAX_LINES) { toast('Your order can have at most ' + MAX_LINES + ' different items.', true); return false; }
      item.qty = 1;
      cart.push(item);
    }
    saveCart();
    return true;
  }
  function findLine(key) { return cart.filter(function (l) { return lineKey(l) === key; })[0]; }

  // Compare the cart with the freshly loaded menu: drop what is gone, refresh prices and names.
  function reconcileCart() {
    if (!catalog) return { removed: 0, priceChanged: false };
    var removed = 0, priceChanged = false, keep = [];
    cart.forEach(function (l) {
      if (l.type === 'SINGLE') {
        var sf = singleFlavor(l.flavor_id);
        if (!sf || typeof sf.single_price !== 'number') { removed++; return; }
        if (l.price !== sf.single_price) priceChanged = true;
        l.price = sf.single_price; l.name = sf.name; l.image_url = sf.image_url || null;
        keep.push(l); return;
      }
      var p = catalog.packages.filter(function (x) { return x.id === l.package_id; })[0];
      if (!p) { removed++; return; }
      if (p.type === 'PICK') {
        var ids = {}; p.flavors.forEach(function (f) { ids[f.id] = f; });
        var sum = 0, ok = true;
        l.flavors.forEach(function (f) {
          if (!ids[f.id] || (!p.allow_same_flavor && f.qty > 1)) ok = false;
          else { f.name = ids[f.id].name; sum += f.qty; }
        });
        if (!ok || sum !== p.pick_count) { removed++; return; }
      } else {
        l.flavors = p.flavors.map(function (f) { return { id: f.id, name: f.name, qty: f.qty }; });
      }
      if (l.price !== p.price) priceChanged = true;
      l.price = p.price; l.name = p.name; l.type = p.type; l.image_url = p.image_url || null;
      keep.push(l);
    });
    cart = keep; saveCart();
    return { removed: removed, priceChanged: priceChanged };
  }

  /* ======================================================================
     Offers (blueprint K40/K41). Every cookie is used once, in this order:
     1) "buy N get M free" promos, 2) bundle price on the leftover singles, 3) plain singles.
     The server prices everything again; this only shows the buyer what to expect.
     ====================================================================== */
  function singleFlavor(fid) { return catalog && catalog.flavors.filter(function (f) { return f.id === fid; })[0]; }
  function catPackage(id) { return catalog && catalog.packages.filter(function (p) { return p.id === id; })[0]; }

  // Can one copy of bundle p be made from the loose singles in L (flavor id -> count)?
  // PICK takes the most expensive allowed singles first. COMBO needs its exact contents.
  function tryBundle(p, L, price) {
    var use = {}, cookies = 0, value = 0, i;
    if (p.type === 'COMBO') {
      for (i = 0; i < p.flavors.length; i++) {
        var cf = p.flavors[i];
        if (!(L[cf.id] >= cf.qty) || typeof price[cf.id] !== 'number') return null;
        use[cf.id] = cf.qty; cookies += cf.qty; value += cf.qty * price[cf.id];
      }
      return cookies ? { use: use, cookies: cookies, value: value } : null;
    }
    var allowed = p.flavors.filter(function (f) { return L[f.id] > 0 && typeof price[f.id] === 'number'; })
      .sort(function (a, b) { return (price[b.id] - price[a.id]) || (a.id - b.id); });
    var need = p.pick_count;
    for (i = 0; i < allowed.length && need > 0; i++) {
      var f = allowed[i], take = p.allow_same_flavor ? Math.min(L[f.id], need) : 1;
      use[f.id] = take; need -= take; cookies += take; value += take * price[f.id];
    }
    return need === 0 && cookies ? { use: use, cookies: cookies, value: value } : null;
  }

  function buildPlan(auto) {
    var cat = catalog || { packages: [], flavors: [], promotions: [] };
    var promos = cat.promotions || [];
    var counts = {}, price = {}, info = {}, manual = [], rawTotal = 0, pool = 0;
    cart.forEach(function (l) {
      rawTotal += l.price * l.qty;
      if (l.type === 'SINGLE') {
        counts[l.flavor_id] = (counts[l.flavor_id] || 0) + l.qty; price[l.flavor_id] = l.price; info[l.flavor_id] = l; pool += l.qty;
      } else manual.push(l);
    });

    // 1) promos on singles use up singles (the cheapest first, which leaves the dearer ones for a bundle price)
    var left = pool, got = {}, hint = {};
    promos.forEach(function (pr) {
      if (pr.condition_type !== 'SINGLES') return;
      if (left >= pr.buy_qty) {
        var times = pr.repeats ? Math.floor(left / pr.buy_qty) : 1;
        left -= times * pr.buy_qty;
        got[pr.id] = times * pr.free_qty;
      } else if (pool > 0) hint[pr.id] = pr.buy_qty - left;
    });
    var L = {}, ids = Object.keys(counts).map(Number);
    ids.forEach(function (id) { L[id] = counts[id]; });
    var rem = pool - left;
    ids.slice().sort(function (a, b) { return (price[a] - price[b]) || (b - a); }).forEach(function (id) {
      var t = Math.min(L[id], rem); L[id] -= t; rem -= t;
    });

    // 2) bundle price on what is left (largest saving per cookie first; on a tie the bigger bundle)
    var absorbed = {}, groups = {}, groupOrder = [], saving = 0, guard = 0;
    while (auto && guard++ < 2000) {
      var best = null;
      cat.packages.forEach(function (p) {
        var t = tryBundle(p, L, price);
        if (!t) return;
        var gain = t.value - p.price;
        if (gain <= 0) return;
        var per = gain / t.cookies;
        if (!best || per > best.per + 1e-9 || (Math.abs(per - best.per) < 1e-9 && t.cookies > best.t.cookies)) best = { p: p, t: t, per: per, gain: gain };
      });
      if (!best) break;
      var key = best.p.id + '|' + Object.keys(best.t.use).sort().map(function (k) { return k + ':' + best.t.use[k]; }).join(',');
      if (!groups[key]) {
        groups[key] = { pkg: best.p, qty: 0, gain: 0, flavors: Object.keys(best.t.use).map(Number).sort(function (a, b) { return a - b; }).map(function (id) {
          return { id: id, name: (singleFlavor(id) || info[id] || {}).name || '', qty: best.t.use[id] };
        }) };
        groupOrder.push(key);
      }
      groups[key].qty++; groups[key].gain += best.gain; saving += best.gain;
      Object.keys(best.t.use).forEach(function (id) { L[id] -= best.t.use[id]; absorbed[id] = (absorbed[id] || 0) + best.t.use[id]; });
    }

    // 3) what stays a single
    var singleLines = [];
    ids.forEach(function (id) {
      var n = counts[id] - (absorbed[id] || 0);
      if (n > 0) singleLines.push({ flavor_id: id, name: info[id].name, price: price[id], qty: n, image_url: info[id].image_url || null });
    });
    // bundles made automatically (a line holds at most MAX_QTY)
    var autoLines = [];
    groupOrder.forEach(function (k) {
      var g = groups[k], q = g.qty;
      while (q > 0) {
        var c = Math.min(q, MAX_QTY);
        autoLines.push({ package_id: g.pkg.id, name: g.pkg.name, type: g.pkg.type, price: g.pkg.price, image_url: g.pkg.image_url || null, qty: c, flavors: g.flavors, auto: true, gain: g.gain * c / g.qty });
        q -= c;
      }
    });

    // promos on bundles count the bundles in the final order (also the ones made automatically)
    var pcount = {};
    manual.concat(autoLines).forEach(function (l) { pcount[l.package_id] = (pcount[l.package_id] || 0) + l.qty; });
    promos.forEach(function (pr) {
      if (pr.condition_type !== 'PACKAGE') return;
      var c = pcount[pr.package_id] || 0;
      if (c >= pr.buy_qty) got[pr.id] = (pr.repeats ? Math.floor(c / pr.buy_qty) : 1) * pr.free_qty;
      else if (c > 0) hint[pr.id] = pr.buy_qty - c;
    });
    var bonus = [], hints = [];
    promos.forEach(function (pr) {
      if (got[pr.id]) bonus.push({ promo: pr, qty: got[pr.id] });
      else if (hint[pr.id]) hints.push({ promo: pr, need: hint[pr.id] });
    });

    var total = singleLines.reduce(function (n, l) { return n + l.price * l.qty; }, 0) +
      manual.concat(autoLines).reduce(function (n, l) { return n + l.price * l.qty; }, 0);
    return { singleLines: singleLines, manual: manual, autoLines: autoLines, bonus: bonus, hints: hints,
      rawTotal: rawTotal, total: total, saving: Math.max(0, rawTotal - total),
      lineCount: singleLines.length + manual.length + autoLines.length };
  }
  function getPlan() {
    var p = buildPlan(true);
    if (p.lineCount > MAX_LINES) p = buildPlan(false);     // too many different bundles: send plain singles instead
    return p;
  }
  // Lines sent to the server (prices are decided there).
  function planItems(plan) {
    var items = [];
    plan.singleLines.forEach(function (l) { items.push({ flavor_id: l.flavor_id, qty: l.qty }); });
    plan.manual.concat(plan.autoLines).forEach(function (l) {
      var it = { package_id: l.package_id, qty: l.qty };
      if (l.type === 'PICK') it.flavors = l.flavors.map(function (f) { return { flavor_id: f.id, qty: f.qty }; });
      items.push(it);
    });
    return items;
  }
  function promoCond(pr) {
    if (pr.condition_type === 'PACKAGE') { var p = catPackage(pr.package_id); return 'Buy ' + pr.buy_qty + ' × ' + (p ? p.name : 'bundle'); }
    return 'Buy ' + pr.buy_qty + ' ' + plural(pr.buy_qty, 'single', 'singles');
  }
  function promoGet(pr) { return 'get ' + pr.free_qty + ' × ' + pr.free_name + ' free'; }

  function getReceipt() { try { return JSON.parse(lsGet(RECEIPT_KEY) || 'null'); } catch (e) { return null; } }

  /* ======================================================================
     Shop status and catalog
     ====================================================================== */
  function applyStore() {
    if (!store) return;
    document.title = store.store_name || 'Cookies';
    $('#brand-name').textContent = store.store_name || 'Cookies';
    var logo = $('#logo');
    if (logo) logo.alt = store.store_name || '';
  }
  function scheduleStoreRefresh() {
    clearTimeout(storeTimer);
    if (!store) return;
    var at = store.is_open ? store.close_at : store.open_at;
    if (!at) return;
    var ms = new Date(at).getTime() - Date.now();
    if (ms > 0 && ms < 2000000000) {
      storeTimer = setTimeout(function () { refreshStore(true); }, ms + 1500);
    }
  }
  async function loadStore() {
    store = await rpc('get_store_status');
    applyStore();
    scheduleStoreRefresh();
    return store;
  }
  async function loadCatalog() {
    var c = await rpc('get_catalog');
    catalog = { packages: (c && c.packages) || [], flavors: (c && c.flavors) || [], promotions: (c && c.promotions) || [] };
    renderPromoBar();
    return catalog;
  }
  async function refreshStore(rerender) {
    if (submitting) return;
    var was = isOpen();
    try {
      await loadStore();
      var r = parseRoute().name;
      if ((r === 'catalog' || r === 'checkout') && (rerender || was !== isOpen())) route(true);
      else renderCartBar();
    } catch (e) { /* keep what we have */ }
  }
  function isOpen() { return !!(store && store.is_open === true); }

  /* ======================================================================
     Router
     ====================================================================== */
  function parseRoute() {
    var h = location.hash || '#/', m;
    if (h === '#' || h === '#/') return { name: 'catalog' };
    if (h === '#/checkout') return { name: 'checkout' };
    if (h === '#/receipt') return { name: 'receipt' };
    if ((m = /^#\/track(?:\/([A-Za-z0-9]{1,16}))?\/?$/.exec(h))) return { name: 'track', code: (m[1] || '').toUpperCase() };
    return { name: 'catalog' };
  }
  function setApp(html) { $('#app').innerHTML = html; }
  function skeleton() {
    return '<div class="sk" style="height:46px;width:70%;margin:12px 0"></div><div class="sk" style="height:76px;margin-bottom:16px"></div>' +
      '<div class="grid"><div class="sk card-sk"></div><div class="sk card-sk"></div><div class="sk card-sk"></div></div>';
  }
  function loadError(retryAction) {
    return '<div class="empty"><h2>We could not load the shop</h2><p class="muted">Please check your internet connection and try again.</p>' +
      '<button class="btn" type="button" data-action="' + retryAction + '">Try again</button></div>';
  }

  async function route(soft) {
    closePicker();
    var r = parseRoute(), seq = ++routeSeq;
    document.body.dataset.route = r.name;
    if (!soft) window.scrollTo(0, 0);
    if (!configOk() || !keyOk()) {
      setApp('<div class="notice error"><div>This website is not set up correctly. Please contact the shop.</div></div>');
      renderCartBar(); return;
    }
    if (r.name === 'catalog' || r.name === 'checkout') {
      if (!store || !catalog) setApp(skeleton());
      try {
        await Promise.all([loadStore(), loadCatalog()]);
      } catch (e) {
        if (seq !== routeSeq) return;
        if (!store || !catalog) { setApp(loadError('retry')); renderCartBar(); return; }
      }
      if (seq !== routeSeq) return;
      var rc = reconcileCart();
      if (rc.removed) toast('Some items are no longer available and were removed from your order.', true);
      if (r.name === 'catalog') viewCatalog(); else viewCheckout(rc.priceChanged);
    } else if (r.name === 'receipt') {
      try { await loadStore(); } catch (e) { /* receipt still works without payment info */ }
      if (seq !== routeSeq) return;
      viewReceipt();
    } else {
      if (store) {
        loadStore().catch(function () { /* keep what we have */ });
      } else {
        try { await loadStore(); } catch (e) { /* tracking works without store info */ }
        if (seq !== routeSeq) return;
      }
      track.data = null; clearProof();
      viewTrack(r.code, false);
    }
    renderCartBar();
  }

  /* ======================================================================
     Catalog
     ====================================================================== */
  function statusNotice() {
    var s = store;
    if (s.is_open) {
      return '<div class="notice open">' + icon('check') + '<div><strong>Open for orders</strong>' +
        (s.close_at ? '<span>Orders close on ' + esc(fmtDate(s.close_at)) + '.</span>' : '') + '</div></div>';
    }
    return '<div class="notice closed">' + icon('info') + '<div><strong>Orders are closed</strong>' +
      (s.closed_message ? '<p>' + esc(s.closed_message) + '</p>' : '') +
      (isFuture(s.open_at) ? '<span>Orders open on ' + esc(fmtDate(s.open_at)) + '.</span>' : '') + '</div></div>';
  }
  function allergyNotice() {
    return store && store.allergy_warning
      ? '<div class="notice allergy">' + icon('info') + '<div><strong>Allergy information</strong><span>' + esc(store.allergy_warning) + '</span></div></div>' : '';
  }
  function pickRule(p) {
    var n = p.pick_count;
    if (!p.allow_same_flavor) return 'Choose ' + n + ' different ' + plural(n, 'flavor', 'flavors') + '.';
    if (n === 1) return 'Choose 1 flavor.';
    return 'Choose ' + n + ' flavors. You can repeat a flavor.';
  }
  function packageCard(p, open) {
    var body = '';
    if (p.description) body += '<p class="desc">' + esc(p.description) + '</p>';
    if (p.type === 'COMBO') {
      body += '<ul class="inc" aria-label="Included flavors">' + p.flavors.map(function (f) {
        return '<li>' + esc(f.qty + ' × ' + f.name) + '</li>';
      }).join('') + '</ul>';
    } else {
      body += '<p class="rule">' + esc(pickRule(p)) + '</p>';
      var shown = p.flavors.slice(0, 5), more = p.flavors.length - shown.length;
      body += '<div class="thumbs" aria-label="' + esc(p.flavors.length + ' flavors to choose from') + '">' +
        shown.map(function (f) { return '<span class="t">' + photo(f.image_url) + '</span>'; }).join('') +
        (more > 0 ? '<span class="t more">+' + more + '</span>' : '') + '</div>';
    }
    var action = !open ? '<span class="muted">Ordering is closed</span>' :
      p.type === 'COMBO' ? '<button class="btn small" type="button" data-action="add-combo" data-id="' + p.id + '">Add to order</button>'
        : '<button class="btn small" type="button" data-action="pick" data-id="' + p.id + '">Choose flavors</button>';
    return '<article class="card"><div class="pic">' + photo(p.image_url) + '</div><div class="body"><h3>' + esc(p.name) + '</h3>' + body +
      '<div class="foot"><span class="price">' + rp(p.price) + '</span>' + action + '</div></div></article>';
  }
  // Promos run as a banner at the very top of the page (above the logo); they are applied automatically.
  function renderPromoBar() {
    var bar = $('#promoBar'), track = $('#promoTrack');
    if (!bar || !track) return;
    var list = (catalog && catalog.promotions) || [];
    if (!list.length) { bar.hidden = true; track.innerHTML = ''; return; }
    var set = list.map(function (pr) {
      return '<span class="promo-item">' + icon('gift') + '<span>' + esc(pr.name) + '</span><em>' + esc(promoCond(pr) + ', ' + promoGet(pr)) + '</em></span>';
    }).join('');
    var chars = list.reduce(function (n, pr) { return n + (pr.name + promoCond(pr) + promoGet(pr)).length + 12; }, 0);
    bar.hidden = false;
    track.innerHTML = '<div class="promo-set">' + set + '</div>';
    var w = track.firstChild.offsetWidth || 1, n = Math.max(1, Math.ceil(bar.clientWidth / w));
    var one = new Array(n + 1).join(set);
    track.style.setProperty('--promo-secs', Math.max(14, Math.round(chars * 0.22 * n)) + 's');
    track.innerHTML = '<div class="promo-set">' + one + '</div><div class="promo-set" aria-hidden="true">' + one + '</div>';
  }
  var promoResizeTimer = null;
  window.addEventListener('resize', function () { clearTimeout(promoResizeTimer); promoResizeTimer = setTimeout(renderPromoBar, 250); });

  function singleQty(fid) {
    var l = cart.filter(function (x) { return x.type === 'SINGLE' && x.flavor_id === fid; })[0];
    return l ? l.qty : 0;
  }
  function flavorDesc(fid) {
    var f = singleFlavor(fid);
    return f && typeof f.description === 'string' ? f.description : '';
  }
  function singleRowHtml(f, open) {
    var q = singleQty(f.id), ctl = '';
    if (open) {
      ctl = q === 0
        ? '<button class="btn small" type="button" data-action="sg-inc" data-fid="' + f.id + '" aria-label="Add one ' + esc(f.name) + '">Add</button>'
        : '<div class="qty" role="group" aria-label="Quantity of ' + esc(f.name) + '">' +
          '<button class="qbtn" type="button" data-action="sg-dec" data-fid="' + f.id + '" aria-label="Remove one ' + esc(f.name) + '">' + icon('minus') + '</button>' +
          '<output>' + q + '</output>' +
          '<button class="qbtn" type="button" data-action="sg-inc" data-fid="' + f.id + '" aria-label="Add one ' + esc(f.name) + '"' + (q >= MAX_SINGLE ? ' disabled' : '') + '>' + icon('plus') + '</button></div>';
    }
    return '<div class="srow" id="sg-' + f.id + '"><div class="sp">' + photo(f.image_url) + '</div><div class="sm"><div class="sn">' + esc(f.name) + '</div>' +
      '<div class="spr">' + rp(f.single_price) + '</div>' + (f.description ? '<div class="sd">' + esc(f.description) + '</div>' : '') + '</div>' + ctl + '</div>';
  }
  function refreshSingleRow(fid, focusAction) {
    var f = singleFlavor(fid), row = $('#sg-' + fid);
    if (!f || !row) return;
    var d = document.createElement('div');
    d.innerHTML = singleRowHtml(f, isOpen());
    row.replaceWith(d.firstChild);
    var b = $('#sg-' + fid + ' [data-action="' + focusAction + '"]') || $('#sg-' + fid + ' button');
    if (b && !b.disabled) b.focus();
  }
  function changeSingle(fid, delta) {
    var f = singleFlavor(fid);
    if (!f || typeof f.single_price !== 'number' || !isOpen()) return;
    var ex = cart.filter(function (x) { return x.type === 'SINGLE' && x.flavor_id === fid; })[0];
    if (delta > 0) {
      if (ex) {
        if (ex.qty >= MAX_SINGLE) { toast('You can order at most ' + MAX_SINGLE + ' of the same item.', true); return; }
        ex.qty++;
      } else {
        if (cart.length >= MAX_LINES) { toast('Your order can have at most ' + MAX_LINES + ' different items.', true); return; }
        cart.push({ type: 'SINGLE', package_id: null, flavor_id: fid, name: f.name, price: f.single_price, image_url: f.image_url || null, flavors: [], qty: 1 });
      }
    } else if (ex) {
      ex.qty--;
      if (ex.qty < 1) cart = cart.filter(function (x) { return x !== ex; });
    }
    saveCart();
    refreshSingleRow(fid, delta > 0 ? 'sg-inc' : 'sg-dec');
    renderCartBar();
  }
  function viewCatalog() {
    var open = isOpen();
    var singles = catalog.flavors.filter(function (f) { return typeof f.single_price === 'number'; });
    var bundles = catalog.packages.map(function (p, i) { return { p: p, pos: typeof p.sort_order === 'number' ? p.sort_order : i + 1, id: p.id }; });
    bundles.sort(function (a, b) { return (a.pos - b.pos) || (a.id - b.id); });
    var singleItems = singles.map(function (f, i) { return { f: f, pos: typeof f.single_sort === 'number' ? f.single_sort : 1000000 + i, id: f.id }; });
    singleItems.sort(function (a, b) { return (a.pos - b.pos) || (a.id - b.id); });
    var html = '<h1>' + (open ? 'Choose your cookies' : 'Our menu') + '</h1>' + statusNotice() + allergyNotice();
    // bundles always first, single cookies below (the order inside each part is set in the admin Layout screen)
    if (bundles.length) {
      html += '<h2>Bundles</h2><div class="grid">' + bundles.map(function (it) { return packageCard(it.p, open); }).join('') + '</div>';
    }
    if (singleItems.length) {
      html += '<h2>Singles</h2><p class="muted sec-note">Single cookies can be ordered one at a time. Bundle prices are applied automatically when they save you money.</p>' +
        '<div class="singles">' + singleItems.map(function (it) { return singleRowHtml(it.f, open); }).join('') + '</div>';
    }
    if (!bundles.length && !singleItems.length) {
      html += '<div class="empty"><p class="muted">No packages are available right now. Please check back soon.</p></div>';
    }
    setApp(html);
  }

  /* ---------- Flavor picker ---------- */
  function openPicker(pkgId) {
    var p = catalog && catalog.packages.filter(function (x) { return x.id === pkgId; })[0];
    if (!p || !isOpen()) return;
    picker = { pkg: p, counts: {}, seq: [], opener: document.activeElement };
    var many = p.pick_count > 12;
    var html = '<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pk-title">' +
      '<div class="sheet-head"><div><h2 id="pk-title">' + esc(p.name) + '</h2><p class="muted" style="margin:2px 0 0">' + esc(pickRule(p)) + '</p></div>' +
      '<button class="xbtn" type="button" data-action="pk-close" aria-label="Close">' + icon('x') + '</button></div>' +
      '<div class="boxbar"><div class="count" id="pk-count" aria-live="polite"></div>' +
      (many ? '<div class="meter" aria-hidden="true"><i id="pk-meter"></i></div>' : '<div class="slots" id="pk-slots" aria-hidden="true"></div>') + '</div>' +
      '<div class="tiles" id="pk-tiles">' + p.flavors.map(function (f) { return tileHtml(p, f); }).join('') + '</div>' +
      '<div class="sheet-foot"><div class="row"><span>Price</span><span class="price">' + rp(p.price) + '</span></div>' +
      '<button class="btn big block" type="button" id="pk-confirm" data-action="pk-confirm" disabled></button></div></div></div>';
    $('#modal-root').innerHTML = html;
    document.body.classList.add('lock');
    updatePicker();
    var x = $('.xbtn', $('#modal-root')); if (x) x.focus();
  }
  function tileHtml(p, f) {
    var fid = f.id;
    if (!p.allow_same_flavor || p.pick_count === 1) {
      // choose-one style: whole tile toggles
      return '<button type="button" class="tile pickone" data-fid="' + fid + '" data-action="pk-toggle" aria-pressed="false">' +
        '<span class="shot">' + photo(f.image_url) + '<span class="badge">' + icon('check') + '</span></span>' +
        '<span class="nm">' + esc(f.name) + '</span>' + (flavorDesc(fid) ? '<span class="nd">' + esc(flavorDesc(fid)) + '</span>' : '') + '</button>';
    }
    return '<div class="tile" data-fid="' + fid + '"><button type="button" class="shot" data-action="pk-add" data-fid="' + fid + '" aria-label="Add one ' + esc(f.name) + '">' +
      photo(f.image_url) + '<span class="badge"></span></button><div class="nm">' + esc(f.name) + '</div>' + (flavorDesc(fid) ? '<div class="nd">' + esc(flavorDesc(fid)) + '</div>' : '') +
      '<div class="ctl"><button class="qbtn" type="button" data-action="pk-sub" data-fid="' + fid + '" aria-label="Remove one ' + esc(f.name) + '">' + icon('minus') + '</button>' +
      '<output aria-live="off">0</output>' +
      '<button class="qbtn" type="button" data-action="pk-add" data-fid="' + fid + '" aria-label="Add one ' + esc(f.name) + '">' + icon('plus') + '</button></div></div>';
  }
  function pickerTotal() { return picker.seq.length; }
  function updatePicker() {
    if (!picker) return;
    var p = picker.pkg, total = pickerTotal(), n = p.pick_count, full = total === n;
    $('#pk-count').textContent = total + ' of ' + n + ' chosen';
    var meter = $('#pk-meter');
    if (meter) meter.style.width = Math.round(total / n * 100) + '%';
    var slots = $('#pk-slots');
    if (slots) {
      var out = '';
      for (var i = 0; i < n; i++) {
        var fid = picker.seq[i];
        var f = fid != null ? p.flavors.filter(function (x) { return x.id === fid; })[0] : null;
        out += '<span class="slot' + (f ? ' full' : '') + '">' + (f ? photo(f.image_url) : '') + '</span>';
      }
      slots.innerHTML = out;
    }
    $$('.tile', $('#pk-tiles')).forEach(function (t) {
      var fid = Number(t.getAttribute('data-fid')), c = picker.counts[fid] || 0;
      t.classList.toggle('on', c > 0);
      if (t.classList.contains('pickone')) t.setAttribute('aria-pressed', c > 0 ? 'true' : 'false');
      else {
        var b = $('.badge', t); if (b) b.textContent = c;
        var o = $('output', t); if (o) o.textContent = c;
        var sub = $('[data-action="pk-sub"]', t); if (sub) sub.disabled = c === 0;
        $$('[data-action="pk-add"]', t).forEach(function (a) { a.disabled = full; });
      }
    });
    var btn = $('#pk-confirm');
    btn.disabled = !full;
    var left = n - total;
    btn.textContent = full ? 'Add to order' : 'Choose ' + left + ' more ' + plural(left, 'flavor', 'flavors');
  }
  function pickerAdd(fid) {
    var p = picker.pkg;
    if (pickerTotal() >= p.pick_count) return;
    if (!p.allow_same_flavor && picker.counts[fid]) return;
    picker.counts[fid] = (picker.counts[fid] || 0) + 1;
    picker.seq.push(fid);
    updatePicker();
  }
  function pickerSub(fid) {
    if (!picker.counts[fid]) return;

  }
  function pickerConfirm() {

      .map(function (f) { return { id: f.id, name: f.name, qty: picker.counts[f.id] }; });
    var ok = addToCart({ package_id: p.id, name: p.name, type: 'PICK', price: p.price, image_url: p.image_url || null, flavors: flavors });

  }
  function closePicker() {

  function renderCartBar() {

  }

  /* ======================================================================
     Checkout
     ====================================================================== */
  function flavText(flavors, always) {

  }
  function linesHtml() {

        '<output>' + l.qty + '</output>' +

        '<span class="lt">' + rp(l.price * l.qty) + '</span></div>' +

  function offersHtml(plan) {

        plan.autoLines.map(function (l) {

        }).join('') + '</div></div>';

      var pr = h.promo;

        (pr.condition_type === 'PACKAGE' ? plural(h.need, 'bundle', 'bundles') : plural(h.need, 'single', 'singles')) + ' to ' + esc(promoGet(pr)) + '.</span></div></div>';

  function freeLinesHtml(plan) {
    return plan.bonus.map(function (b) {
      var f = b.promo.free_flavor_id ? singleFlavor(b.promo.free_flavor_id) : null;
      return '<article class="line free"><div class="lp">' + (f ? photo(f.image_url) : placeholder()) + '</div><div class="lm">' +
        '<div class="ln">' + esc(b.qty + ' × ' + b.promo.free_name) + '</div><div class="lf">Free · ' + esc(b.promo.name) + '</div>' +
        '<div class="lr"><span class="freetag">FREE</span></div></div></article>';
    }).join('');
  }
  function bankLabel() { return (store && store.bank_name) || 'BCA'; }
  function viewCheckout(priceChanged) {
    var back = '<a class="back" href="#/">' + icon('back') + 'Back to menu</a>';
    if (!isOpen()) {
      setApp(back + '<div class="narrow"><h1>Your order</h1>' + statusNotice() + '<a class="btn" href="#/">See the menu</a></div>');

    }
    if (!cart.length) {
      setApp(back + '<div class="empty"><h1>Your order is empty</h1><p class="muted">Add a package from the menu to get started.</p><a class="btn" href="#/">Browse the menu</a></div>');
      return;
    }
    var html = back + '<div class="narrow"><h1>Your order</h1>' +
      (priceChanged ? '<div class="notice allergy">' + icon('info') + '<div>Prices have been updated by the store.</div></div>' : '') +
      '<div class="panel"><div id="co-lines"></div><div class="totals" id="co-totals"></div></div>' +

  /* ---------- Receipt image drawn directly on a canvas (no extra library) ---------- */
  var FONT_D = '"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  var FONT_B = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  function loadImage(url) {
    return new Promise(function (resolve) {
      var u = safeUrl(url);

      i.onload = function () { resolve(i); }; i.onerror = function () { resolve(null); };

  function wrapText(ctx, text, maxW) {
    var out = [], words = String(text).split(/\s+/), line = '';

      var t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) { line = t; return; }
      if (line) out.push(line);
      line = '';
      while (ctx.measureText(w).width > maxW) {          // very long word: break it
        var k = w.length;
        while (k > 1 && ctx.measureText(w.slice(0, k)).width > maxW) k--;
        out.push(w.slice(0, k)); w = w.slice(k);
      }
      line = w;
    });
    if (line) out.push(line);
    return out;
  }
  // d: normalized order data. Returns a canvas.
  async function drawReceipt(d) {
    try { await Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'), document.fonts.load('700 24px "Bricolage Grotesque"')]); } catch (e) { /* use fallback font */ }

    var logoImg = null;      // shop logo on top of the receipt (same website, so the picture can be drawn safely)
    try { if (LOGO_URL) logoImg = await loadImage(new URL(LOGO_URL, location.href.split('#')[0]).href); } catch (e) { logoImg = null; }
    var W = 720, M = 24, PAD = 40, IN = W - 2 * M - 2 * PAD, X0 = M + PAD;

        ctx.strokeStyle = '#E3D8C8'; ctx.lineWidth = 2; ctx.stroke();
      }
      function txt(str, o) {
        o = o || {};
        var size = o.size || 24, weight = o.weight || 400, color = o.color || '#46301C', align = o.align || 'left', lh = Math.round(size * (o.lh || 1.3));

        var lines = wrapText(ctx, str, o.maxW || IN);

        o = o || {}; var size = o.size || 24, weight = o.weight || 400, lh = Math.round(size * 1.35);

          ctx.textAlign = 'left'; ctx.fillText(lines[0], X0, y + size);

        txt(s.store_name || 'Cookies', { size: 38, weight: 800, display: true });

      if (draw) {

      gap(14); dash(); gap(16);
      (d.items || []).forEach(function (it) {

      dash(); gap(14);
      row('Subtotal', rp(d.subtotal), { size: 24 });
      if (d.unique_code) row('Unique code', rp(d.unique_code), { size: 24 });
      gap(4);
      row('Total', rp(d.total), { size: 36, weight: 800, display: true });
      gap(16);
      if (d.payment_status !== 'PAID' && d.payment_method !== 'CASH_COD' && ['PENDING', 'PROCESSING'].indexOf(d.status) !== -1 || d.pay_hint) {

        if (d.payment_method === 'BCA') {
          txt('Pay by bank transfer', { size: 24, weight: 700, display: true });
          txt('Transfer exactly ' + rp(d.total), { size: 24, weight: 700 });
          if (s.bank_account_number) txt(bankLabel() + ' ' + s.bank_account_number, { size: 24 });
          if (s.bank_account_holder) txt('Account holder: ' + s.bank_account_holder, { size: 22, color: '#7B6450' });
        } else if (d.payment_method === 'QRIS') {
          txt('Pay with QRIS', { size: 24, weight: 700, display: true });
          txt('Pay exactly ' + rp(d.total), { size: 24, weight: 700 });
          if (qrImg) { var qs = 300; if (draw) ctx.drawImage(qrImg, W / 2 - qs / 2, y + 8, qs, qs); y += qs + 16; }
        } else {
          txt('Pay in cash when you receive your order.', { size: 24 });
        }
        gap(10);
      } else if (d.payment_method === 'CASH_COD' && d.status !== 'COMPLETED' && d.status !== 'CANCELLED') {
        dash(); gap(14);

      if (s.receipt_text) { txt(s.receipt_text, { size: 20, color: '#7B6450' }); gap(10); }
      txt('Track your order: ' + location.href.split('#')[0].split('?')[0] + '#/track/' + d.tracking_code, { size: 19, color: '#7B6450' });

    }
    var scratch = document.createElement('canvas').getContext('2d');
    var H = run(scratch, false);

  }
